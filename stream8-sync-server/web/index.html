<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stream8 Sync — Admin</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main>
      <div class="top-row">
        <div>
          <h1 data-i18n="title">Stream8 Sync</h1>
          <p class="subtitle" data-i18n="subtitle"></p>
        </div>
        <div class="lang-picker">
          <label for="lang-select" data-i18n="lang_label">Lingua</label>
          <select id="lang-select">
            <option value="system" data-i18n="lang_system">Sistema</option>
            <option value="it" data-i18n="lang_it">Italiano</option>
            <option value="en" data-i18n="lang_en">Inglese</option>
            <option value="fr" data-i18n="lang_fr">Francese</option>
          </select>
        </div>
      </div>

      <section class="card">
        <h2 data-i18n="new_account_heading">Nuovo account</h2>
        <form id="create-form">
          <input type="text" id="label-input" data-i18n-placeholder="label_placeholder" required />
          <button type="submit" data-i18n="create_button">Crea chiave API</button>
        </form>
        <div id="new-key-box" class="new-key-box hidden">
          <p><strong data-i18n="copy_hint"></strong></p>
          <code id="new-key-value"></code>
          <button id="copy-key-btn" type="button" data-i18n="copy_button">Copia</button>
        </div>
      </section>

      <section class="card">
        <h2 data-i18n="existing_accounts_heading">Account esistenti</h2>
        <table id="accounts-table">
          <thead>
            <tr>
              <th data-i18n="th_name">Nome</th>
              <th data-i18n="th_created">Creato il</th>
              <th data-i18n="th_last_sync">Ultima sync</th>
              <th data-i18n="th_entries">Voci</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="accounts-body">
            <tr><td colspan="5">...</td></tr>
          </tbody>
        </table>
      </section>
    </main>
    <footer class="site-footer">
      <span class="credits" data-i18n="footer_credits">Go &middot; SQLite (modernc.org/sqlite, BSD-3-Clause)</span>
      <a href="https://github.com/rizzonicola" target="_blank" rel="noopener" class="gh-link" aria-label="GitHub: rizzonicola">
        <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
            0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01
            1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95
            0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 4 0c1.53-1.04
            2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54
            1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
        </svg>
        <span data-i18n="footer_github">rizzonicola on GitHub</span>
      </a>
    </footer>
    <script src="/i18n.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
